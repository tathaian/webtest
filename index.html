<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tính tiền mua bán</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #f5f5f5;
    margin: 0;
    padding: 12px;
  }
  header {
    text-align: center;
    margin-bottom: 16px;
  }
  h1 { margin: 0; font-size: 1.5rem; color: #1a1a1a; }
  .subtitle { color: #666; font-size: 0.9rem; }

  table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  th, td {
    padding: 12px 10px;
    text-align: left;
    border-bottom: 1px solid #eee;
  }
  th {
    background: #1a1a1a;
    color: white;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    position: sticky;
    top: 0;
    z-index: 2;
  }
  tr:last-child td { border-bottom: none; }
  tr:nth-child(even) { background: #fafafa; }

  .name-cell { font-weight: 500; color: #222; }
  .price-cell { font-weight: 600; color: #d32f2f; white-space: nowrap; }
  .qty-cell { width: 110px; }
  .total-cell { font-weight: 700; color: #1565c0; white-space: nowrap; }

  input.qty {
    width: 100%;
    padding: 8px 6px;
    font-size: 1rem;
    border: 1px solid #ccc;
    border-radius: 6px;
    text-align: center;
  }
  input.qty:focus { outline: none; border-color: #1565c0; }

  .summary {
    margin-top: 16px;
    background: white;
    padding: 16px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }
  .grand-total {
    font-size: 1.4rem;
    font-weight: 800;
    color: #d32f2f;
  }
  .item-count { color: #666; font-size: 0.95rem; }

  .actions {
    margin-top: 12px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  button {
    flex: 1;
    min-width: 140px;
    padding: 12px;
    font-size: 1rem;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
  }
  .btn-reset { background: #ffebee; color: #d32f2f; }
  .btn-reset:hover { background: #ffcdd2; }
  .btn-print { background: #1565c0; color: white; }
  .btn-print:hover { background: #0d47a1; }

  @media (max-width: 480px) {
    th, td { padding: 8px 6px; font-size: 0.9rem; }
    h1 { font-size: 1.2rem; }
    .grand-total { font-size: 1.2rem; }
  }
</style>
</head>
<body>

<header>
  <h1>🧾 Tính tiền mua bán</h1>
  <div class="subtitle">Nhập số lượng, nhấn Enter → tự động tính thành tiền</div>
</header>

<table>
  <thead>
    <tr>
      <th style="width:40px">#</th>
      <th>Tên hàng</th>
      <th style="text-align:right">Giá</th>
      <th style="text-align:center">Số lượng</th>
      <th style="text-align:right">Thành tiền</th>
    </tr>
  </thead>
  <tbody id="productBody"></tbody>
</table>

<div class="summary">
  <div>
    <div class="item-count" id="itemCount">0 món</div>
  </div>
  <div class="grand-total" id="grandTotal">0 đ</div>
</div>

<div class="actions">
  <button class="btn-reset" onclick="resetAll()">🗑️ Xóa hết</button>
  <button class="btn-print" onclick="window.print()">🖨️ In hóa đơn</button>
</div>

<script>
const products = [
  { name: "Lá sen", price: 10000 },
  { name: "Dừa gà", price: 10000 },
  { name: "Xương chó", price: 10000 },
  { name: "Bóng ngô", price: 12000 },
  { name: "Mí trẻ em", price: 1000 },
  { name: "Nước teago", price: 5000 },
  { name: "Chân gà bà tuyết", price: 10000 },
  { name: "Hổ kaka", price: 2000 },
  { name: "Cá viên chiên", price: 1000 },
  { name: "gân gà", price: 2000 },
  { name: "vòi rồng", price: 2000 },
  { name: "Mèo yêu cá", price: 2000 },
  { name: "nem tôm", price: 2000 },
  { name: "tăm cay", price: 2000 },
  { name: "balo hồng", price: 2000 },
  { name: "Bánh tráng mix", price: 5000 },
  { name: "Thạch dừa", price: 1000 }
];

const bodyEl = document.getElementById('productBody');
const itemCountEl = document.getElementById('itemCount');
const grandTotalEl = document.getElementById('grandTotal');

const formatVND = (n) => new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(n).replace('₫', 'đ');

function renderTable() {
  bodyEl.innerHTML = '';
  products.forEach((p, i) => {
    const tr = document.createElement('tr');

    const tdNo = document.createElement('td');
    tdNo.textContent = i + 1;
    tdNo.style.textAlign = 'center';
    tdNo.style.fontWeight = 'bold';

    const tdName = document.createElement('td');
    tdName.className = 'name-cell';
    tdName.textContent = p.name;

    const tdPrice = document.createElement('td');
    tdPrice.className = 'price-cell';
    tdPrice.style.textAlign = 'right';
    tdPrice.textContent = formatVND(p.price);

    const tdQty = document.createElement('td');
    tdQty.className = 'qty-cell';
    tdQty.style.textAlign = 'center';
    const input = document.createElement('input');
    input.type = 'number';
    input.min = '0';
    input.value = '0';
    input.className = 'qty';
    input.dataset.index = i;
    input.addEventListener('input', calcTotal);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const next = input.parentElement.parentElement.nextElementSibling;
        if (next) {
          const nextInput = next.querySelector('input.qty');
          if (nextInput) nextInput.focus();
        }
      }
    });
    tdQty.appendChild(input);

    const tdTotal = document.createElement('td');
    tdTotal.className = 'total-cell';
    tdTotal.style.textAlign = 'right';
    tdTotal.textContent = '0 đ';

    tr.append(tdNo, tdName, tdPrice, tdQty, tdTotal);
    bodyEl.appendChild(tr);
  });
  calcTotal();
}

function calcTotal() {
  let total = 0;
  let itemCount = 0;

  document.querySelectorAll('input.qty').forEach((input, i) => {
    const qty = parseInt(input.value) || 0;
    const price = products[i].price;
    const lineTotal = qty * price;

    const tdTotal = input.closest('tr').querySelector('.total-cell');
    tdTotal.textContent = lineTotal > 0 ? formatVND(lineTotal) : '0 đ';

    if (qty > 0) {
      total += lineTotal;
      itemCount += qty;
    }
  });

  itemCountEl.textContent = `${itemCount} sản phẩm`;
  grandTotalEl.textContent = formatVND(total);
}

function resetAll() {
  document.querySelectorAll('input.qty').forEach(input => {
    input.value = '0';
  });
  calcTotal();
}

renderTable();
</script>

</body>
</html>
